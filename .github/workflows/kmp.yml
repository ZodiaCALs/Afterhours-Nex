# Builds AfterhoursNex: tests the shared core, builds the Android app, and builds the
# desktop installers on real Windows, macOS and Linux machines (each installer can only be made on its own system).
# Push a tag such as nex-v1.2.0 to publish a GitHub release with every download attached.
name: AfterhoursNex
on:
  push:
    branches: ["**"]
    tags: ["nex-v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  GRADLE_VERSION: "9.8.1"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - run: gradle :shared:desktopTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: shared/build/reports/tests/

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Use the release key, if there is one
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Note the repository, for the update checker
        shell: bash
        run: perl -pi -e 's|const val REPO = ""|const val REPO = "$ENV{GITHUB_REPOSITORY}"|' shared/src/commonMain/kotlin/app/afterhours/core/Model.kt
      - run: gradle :androidApp:assembleRelease :androidApp:bundleRelease --stacktrace
      - name: Name the files after the version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' androidApp/build.gradle.kts | cut -d'"' -f2)
          mkdir -p $GITHUB_WORKSPACE/dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$GITHUB_WORKSPACE/dist/AfterhoursNex-$VERSION-Android.apk"
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "$GITHUB_WORKSPACE/dist/AfterhoursNex-$VERSION-Android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: ":desktopApp:packageExe :desktopApp:packageMsi :desktopApp:createDistributable"
            portable: Windows-portable.zip
          - os: macos-latest
            tasks: ":desktopApp:packageDmg"
            portable: ""
          - os: ubuntu-latest
            tasks: ":desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable"
            portable: Linux-portable.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Tools for .rpm packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Note the repository, for the update checker
        shell: bash
        run: perl -pi -e 's|const val REPO = ""|const val REPO = "$ENV{GITHUB_REPOSITORY}"|' shared/src/commonMain/kotlin/app/afterhours/core/Model.kt
      - run: gradle ${{ matrix.tasks }} --stacktrace
      - name: Gather the installers and portable archives
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          find desktopApp/build/compose/binaries/main -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} $GITHUB_WORKSPACE/dist/ \;
          VERSION=$(grep -o 'packageVersion = "[^"]*"' desktopApp/build.gradle.kts | cut -d'"' -f2)
          APP=desktopApp/build/compose/binaries/main/app
          case "${{ matrix.portable }}" in
            *.zip) (cd "$APP" && 7z a -tzip "$GITHUB_WORKSPACE/dist/AfterhoursNex-$VERSION-${{ matrix.portable }}" AfterhoursNex > /dev/null) ;;
            *.tar.gz) tar -czf "$GITHUB_WORKSPACE/dist/AfterhoursNex-$VERSION-${{ matrix.portable }}" -C "$APP" AfterhoursNex ;;
          esac
          ls -la $GITHUB_WORKSPACE/dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ runner.os }}
          path: dist/

  web:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Package AfterhoursNex Web
        run: |
          VERSION=$(grep -o 'packageVersion = "[^"]*"' desktopApp/build.gradle.kts | cut -d'"' -f2)
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd web && zip -q "$GITHUB_WORKSPACE/dist/AfterhoursNex-$VERSION-Web.zip" afterhoursnex-web.py README.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/nex-v')
    needs: [android, desktop, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AfterhoursNex ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
